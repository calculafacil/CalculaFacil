<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; background: #0d1117; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <style>
    .fondo { fill: #0d1117; }
    .prompt {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      fill: #22c55e;
      font-size: 160px;
    }
    .texto-logo {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      fill: #33ff33;
      font-size: 215px;
      letter-spacing: 2px;
    }
    .cursor { fill: #33ff33; }
  </style>
  <rect width="500" height="500" class="fondo" />
  <text x="52" y="322" class="prompt">&gt;</text>
  <text x="128" y="330" class="texto-logo">CF</text>
  <rect x="392" y="152" width="44" height="178" class="cursor" />
</svg>
</body>
</html>
